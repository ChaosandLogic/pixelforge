[package]
name = "gpu-engine"
version = "0.1.0"
edition = "2021"
description = "PixelForge GPU TOP sidecar"

[dependencies]
bytemuck = { version = "1.23", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wgpu = "24"

[build-dependencies]
cc = "1"

[profile.release]
lto = "thin"
codegen-units = 1
